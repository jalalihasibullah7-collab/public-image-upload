<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pakistan Online Visa</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
font-family:Tahoma,Arial,sans-serif;min-height:100vh;
background:linear-gradient(135deg,#eefaf2 0%,#ffffff 50%,#e6f6ed 100%);
color:#163b28
}
header{
background:linear-gradient(135deg,#006b35,#099447);
color:#fff;padding:22px 7%;
display:flex;align-items:center;justify-content:space-between;
box-shadow:0 5px 22px #006b3530
}
.logo{font-size:27px;font-weight:800;letter-spacing:.2px}
.logo small{display:block;font-size:11px;font-weight:400;opacity:.85;margin-top:3px}
.badge{background:#ffffff20;border:1px solid #ffffff40;padding:9px 15px;border-radius:30px}
main{max-width:920px;margin:55px auto;padding:0 20px}
.card{
background:#fff;border:1px solid #dcefe3;border-radius:28px;
padding:45px;box-shadow:0 18px 50px #087a3d15
}
.hero{text-align:center;margin-bottom:30px}
.hero h1{font-size:35px;color:#006b35;margin-bottom:10px}
.hero p{color:#718078;font-size:15px}
.upload{
border:2px dashed #36a66a;border-radius:22px;padding:45px 20px;
background:#f8fffa;text-align:center;cursor:pointer;transition:.25s
}
.upload:hover,.upload.drag{background:#edfaf2;border-color:#006b35;transform:translateY(-2px)}
.icon{font-size:55px;margin-bottom:12px}
.upload strong{display:block;font-size:19px;margin-bottom:9px}
.upload small{color:#77867e}
input{display:none}
.actions{display:flex;justify-content:center;gap:12px;margin-top:20px}
button{
border:0;border-radius:13px;padding:13px 28px;cursor:pointer;
font-family:inherit;font-size:15px;font-weight:bold;transition:.2s
}
.choose{background:#e7f6ed;color:#006b35}
.choose:hover{background:#d8f0e1}
.uploadBtn{background:#006b35;color:#fff;display:none}
.uploadBtn:hover{background:#00562b;transform:translateY(-1px)}
#preview{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:20px;margin-top:30px}
.item{
background:#f6faf7;border:1px solid #dcebe1;border-radius:18px;padding:9px;
box-shadow:0 5px 16px #00000009;position:relative
}
.item img{width:100%;height:165px;object-fit:cover;border-radius:12px;display:block;cursor:pointer}
.item .open{font-size:12px;color:#527062;text-align:center;padding:9px 2px 3px}
.remove{
position:absolute;top:14px;left:14px;width:32px;height:32px;padding:0;
border-radius:50%;background:#d9362b;color:#fff;z-index:2
}
.status{
margin-top:18px;text-align:center;color:#087a3d;font-size:14px;
display:none
}
.empty{text-align:center;color:#8a9890;margin-top:24px}
.links{margin-top:22px;display:none}
.linkBox{background:#f4fbf6;border:1px solid #cfe8d8;border-radius:15px;padding:14px;margin-top:12px;text-align:right}
.linkBox label{display:block;font-size:13px;color:#547064;margin-bottom:8px}
.linkRow{display:flex;gap:8px}
.linkRow input{display:block;flex:1;background:#fff;border:1px solid #cfe0d6;border-radius:10px;padding:10px;font-family:Arial;direction:ltr}
.copyBtn{background:#006b35;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px}
.copyBtn:hover{background:#00562b}
.uploading{opacity:.65;pointer-events:none}
footer{text-align:center;padding:28px;color:#78877f;font-size:13px}
@media(max-width:600px){
header{padding:18px 5%}.logo{font-size:21px}.badge{display:none}
main{margin:28px auto}.card{padding:28px 16px}.hero h1{font-size:28px}
.upload{padding:35px 12px}
}
</style>
</head>
<body>
<header>
<div class="logo">Pakistan Online Visa<small>Online Visa Services</small></div>
<div class="badge">🇵🇰 Pakistan Visa</div>
</header>

<main>
<div class="card">
<div class="hero">
<h1>آپلود عکس</h1>
<p>عکس موردنظر خود را انتخاب کنید و سپس روی دکمه «آپلود» بزنید.</p>
</div>

<div class="upload" id="dropZone">
<div class="icon">📷</div>
<strong>عکس را اینجا بکشید و رها کنید</strong>
<small>یا برای انتخاب عکس کلیک کنید</small>
<div class="actions">
<button class="choose" id="chooseBtn" type="button">انتخاب عکس</button>
</div>
</div>

<input id="fileInput" type="file" accept="image/*" multiple>

<div class="actions">
<button class="uploadBtn" id="uploadBtn" type="button">آپلود</button>
</div>

<div class="status" id="status">✓ عکس با موفقیت آپلود شد.</div>
<div id="links"></div>
<div id="preview"></div>
<div class="empty" id="empty">هنوز عکسی انتخاب نشده است.</div>
</div>
</main>

<footer>© 2026 Pakistan Online Visa — خدمات آنلاین ویزا</footer>

<script>
const input=document.getElementById('fileInput');
const zone=document.getElementById('dropZone');
const choose=document.getElementById('chooseBtn');
const uploadBtn=document.getElementById('uploadBtn');
const preview=document.getElementById('preview');
const empty=document.getElementById('empty');
const status=document.getElementById('status');
const linksBox=document.getElementById('links');

let selected=[];

choose.addEventListener('click',e=>{e.stopPropagation();input.click()});
zone.addEventListener('click',()=>input.click());
input.addEventListener('change',()=>selectFiles(input.files));

['dragenter','dragover'].forEach(ev=>zone.addEventListener(ev,e=>{
e.preventDefault();zone.classList.add('drag')
}));
['dragleave','drop'].forEach(ev=>zone.addEventListener(ev,e=>{
e.preventDefault();zone.classList.remove('drag')
}));
zone.addEventListener('drop',e=>selectFiles(e.dataTransfer.files));

function selectFiles(files){
[...files].forEach(file=>{
if(file.type.startsWith('image/')) selected.push(file);
});
renderSelected();
}

function renderSelected(){
preview.innerHTML='';
selected.forEach((file,index)=>{
const url=URL.createObjectURL(file);
const item=document.createElement('div');
item.className='item';
item.innerHTML=`<button class="remove" title="حذف">×</button>
<img src="${url}" alt="Selected image"><div class="open">برای مشاهده کلیک کنید</div>`;
item.querySelector('.remove').onclick=(e)=>{
e.stopPropagation();URL.revokeObjectURL(url);selected.splice(index,1);renderSelected()
};
preview.appendChild(item);
});
empty.style.display=selected.length?'none':'block';
uploadBtn.style.display=selected.length?'inline-block':'none';
status.style.display='none';
linksBox.style.display='none';
linksBox.innerHTML='';
}

uploadBtn.addEventListener('click', async ()=>{
if(!selected.length)return;
uploadBtn.disabled=true;
uploadBtn.textContent='در حال آپلود...';
zone.classList.add('uploading');
status.style.display='block';
status.textContent='⏳ در حال آپلود عکس...';
linksBox.innerHTML='';
linksBox.style.display='none';

try{
  for(const file of selected){
    const form=new FormData();
    form.append('file',file,file.name);
    const response=await fetch('/api/upload',{
      method:'POST',
      body:form
    });
    const data=await response.json();
    if(!response.ok || !data.success || !data.link){
      throw new Error(data.error || 'آپلود ناموفق بود');
    }

    const box=document.createElement('div');
    box.className='linkBox';
    box.innerHTML=`<label>لینک عمومی عکس:</label>
      <div class="linkRow">
        <input type="text" value="${data.link}" readonly>
        <button type="button" class="copyBtn">کپی لینک</button>
      </div>`;
    box.querySelector('.copyBtn').onclick=async()=>{
      await navigator.clipboard.writeText(data.link);
      box.querySelector('.copyBtn').textContent='کپی شد ✓';
      setTimeout(()=>box.querySelector('.copyBtn').textContent='کپی لینک',1500);
    };
    linksBox.appendChild(box);

    const item=preview.children[selected.indexOf(file)];
    if(item){
      const img=item.querySelector('img');
      img.onclick=()=>window.open(data.link,'_blank');
      item.querySelector('.open').textContent='برای باز کردن لینک کلیک کنید';
    }
  }
  linksBox.style.display='block';
  status.textContent='✓ عکس با موفقیت آپلود شد و لینک عمومی ساخته شد.';
}catch(err){
  status.textContent='✕ خطا: '+err.message;
}finally{
  uploadBtn.disabled=false;
  uploadBtn.textContent='آپلود';
  zone.classList.remove('uploading');
}
});
</script>
</body>
</html>
